name: Build APK (Treino GT)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Usa Gradle 8.7 direto (não depende do gradle-wrapper.jar, que não está no projeto).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Testes unitários (JVM)
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK de debug
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TreinoGT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: app/build/reports/tests/
